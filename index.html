<!-- Rosebay ordering demo — one page, no build step.
     Guests order from a table; the kitchen screen sees the order arrive and moves it along.
     Shared state: the Claude artifact's `db` capability when a signed-in viewer opens it, so two
     devices see the same orders. Everywhere else (GitHub Pages, a local file) each browser keeps
     its own orders — the page says so rather than pretending.
     Menu, photographs and their captions come from data.js, built from the studio's catalogue. -->

    },
  };

  let lang = 'th';
  const t = () => T[lang];
  const $ = (s, r) => (r || document).querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const baht = (n) => '฿' + Number(n).toLocaleString('en-US');
  const nameOf = (it) => (lang === 'th' ? (it.th || it.en) : (it.en || it.th)) || it.id;

  /* ── the order store ───────────────────────────────────────────────────
     One adapter over two backings: the artifact's shared db when a viewer is
     signed in to it, otherwise this browser's own localStorage. Every screen
     reads through here, so the same code runs either way. */
  const Store = {
    shared: false, db: null, orders: [], _subs: [],
    KEY: 'rosebay-order-demo-v1',

    async init() {
      try {
        const db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null;
        if (db) { this.db = db; this.shared = true; }
      } catch (err) { /* no viewer, or the capability is not granted: stay local */ }
      if (this.shared) {
        try {
          this.db.collection('orders').onSnapshot((docs) => {
            this.orders = (docs || []).map((d) => (d && d.data ? d.data : d)).filter(Boolean);
            this._emit();
          });
          return;
        } catch (err) { this.shared = false; this.db = null; }
      }
      this.orders = this._readLocal();
      this._emit();
    },
    _readLocal() {
      try { const raw = localStorage.getItem(this.KEY); return raw ? JSON.parse(raw) : []; } catch (err) { return []; }
    },
    _writeLocal() {
      try { localStorage.setItem(this.KEY, JSON.stringify(this.orders)); } catch (err) { /* private window: keep it in memory */ }
    },
    onChange(fn) { this._subs.push(fn); },
    _emit() { for (const fn of this._subs) fn(); },

    async add(order) {
      if (this.shared) {
        try { await this.db.collection('orders').doc(order.id).set(order); return true; } catch (err) { /* fall through */ }
      }
      this.orders = this.orders.concat([order]);
      this._writeLocal(); this._emit();
      return true;
    },
    async setStatus(id, status) {
      const found = this.orders.find((o) => o.id === id);
      if (!found) return;
      const next = Object.assign({}, found, {
        status,
        history: (found.history || []).concat([{ status, at: new Date().toISOString() }]),
      });
      if (this.shared) {
        try { await this.db.collection('orders').doc(id).set(next); return; } catch (err) { /* fall through */ }
      }
      this.orders = this.orders.map((o) => (o.id === id ? next : o));
      this._writeLocal(); this._emit();
    },
    all() { return this.orders.slice().sort((a, b) => String(b.placedAt).localeCompare(String(a.placedAt))); },
    forTable(tableId) { return this.all().filter((o) => o.tableId === tableId); },
  };

  /* ── this browser's own choices ────────────────────────────────────── */
  const Me = {
    get table() { try { return localStorage.getItem('rosebay-table') || null; } catch (err) { return this._t || null; } },
    set table(v) { this._t = v; try { localStorage.setItem('rosebay-table', v); } catch (err) { /* ignore */ } },
  };
  const TABLES = ['01', '02', '03', '04', '05', '06', '07', '08'];
  const tableName = (id) => (lang === 'th' ? 'โต๊ะ ' : 'Table ') + id;

  let cart = [];      // {itemId, name, qty, unitTHB, variant}
  let cartNote = '';
  let screen = 'index';
  let group = 'food';
  let category = null;
  let query = '';

  /* ── captions, exactly as the catalogue records them ─────────────────── */
  function captionOf(img) {
    if (!img) return null;
    if (img.kind === 'sample' && img.sample) {
      const s = img.sample;
      const parts = [lang === 'th' ? s.labelTh : s.labelEn];
      if (s.licence) parts.push(t().capSampleLic + ' ' + s.licence + (lang === 'th' ? '' : ' licence'));
      if (s.attribution && s.creator) parts.push(t().capBy + ' ' + s.creator);
      return { text: parts.join(' · '), sample: true, licenceUrl: s.licenceUrl || null, sourceUrl: s.sourceUrl || null };
    }
    const map = {
      'restaurant-post': t().capRestaurant,
      'printed-menu': t().capPrinted,
      'menu-card': t().capMenuCard,
      'third-party': t().capOther,
    };
    return { text: map[img.kind] || '', sample: false };
  }

  function priceLine(it) {
    if (it.pk === 'pending') return t().pricePending;
    if (it.pk === 'conflicting') return t().priceConflicting;
    return t().priceHistorical;
  }

  /* ── building blocks ─────────────────────────────────────────────────── */
  function thumbNode(it) {
    const box = el('div', 'thumb' + (it.img && it.img.fit === 'contain' ? ' thumb--contain' : ''));
    if (it.img && it.img.bg) box.style.background = it.img.bg;
    const img = el('img');
    img.src = it.img.s320 || it.img.s;
    img.alt = '';
    img.loading = 'lazy';
    img.width = 320; img.height = 320;
    if (it.img.fit !== 'contain') img.style.objectPosition = it.img.pos;
    box.appendChild(img);
    if (it.img.kind === 'sample') box.appendChild(el('span', 'thumb__tag', t().sampleTag));
    return box;
  }

  function cardNode(it) {
    const card = el('article', 'card');
    card.dataset.itemId = it.id;
    if (it.img) card.appendChild(thumbNode(it));

    const body = el('div', 'card__body');
    const h3 = el('h3', 'card__name');
    const open = el('button', null, nameOf(it));
    open.type = 'button';
    open.setAttribute('aria-label', t().details + ': ' + nameOf(it));
    open.addEventListener('click', () => openSheet(it));
    h3.appendChild(open);
    body.appendChild(h3);

    const other = lang === 'th' ? it.en : it.th;
    if (other && other !== nameOf(it)) body.appendChild(el('p', 'card__sub', other));

    const cap = captionOf(it.img);
    if (cap && cap.text) body.appendChild(el('p', 'card__cap', cap.text));

    const foot = el('div', 'card__foot');
    const price = el('div', 'price');
    price.append(it.p == null ? '—' : baht(it.p), el('small', null, priceLine(it)));
    foot.appendChild(price);
    const add = el('button', 'btn btn--small', t().add);
    add.type = 'button';
    add.addEventListener('click', () => { addToCart(it, 1, null); flash(add); });
    foot.appendChild(add);
    body.appendChild(foot);

    card.appendChild(body);
    return card;
  }

  function flash(btn) {
    const was = btn.textContent;
    btn.textContent = t().added;
    btn.disabled = true;
    setTimeout(() => { btn.textContent = was; btn.disabled = false; }, 900);
  }

  /* ── item dialog ─────────────────────────────────────────────────────── */
  function openSheet(it) {
    const dlg = $('[data-sheet]');
    dlg.textContent = '';
    let qty = 1;
    let variant = it.v && it.v.length ? 0 : null;

    const head = el('div', 'sheet__head');
    const name = el('h2', 'sheet__name', nameOf(it));
    name.id = 'sheet-name';
    const close = el('button', 'sheet__close', '✕');
    close.type = 'button';
    close.setAttribute('aria-label', lang === 'th' ? 'ปิด' : 'Close');
    close.addEventListener('click', () => dlg.close());
    head.append(name, close);

    const body = el('div', 'sheet__body');
    if (it.img) {
      const ph = el('div', 'sheet__photo');
      if (it.img.bg) ph.style.background = it.img.bg;
      const img = el('img');
      img.src = it.img.s;
      img.alt = (lang === 'th' ? it.img.altTh : it.img.altEn) || '';
      if (it.img.fit === 'contain') img.style.objectFit = 'contain';
      ph.appendChild(img);
      body.appendChild(ph);

      const cap = captionOf(it.img);
      if (cap && cap.text) {
        const p = el('p', 'cap');
        if (cap.sample) { const b = el('b'); b.textContent = cap.text.split(' · ')[0]; p.append(b, ' · ' + cap.text.split(' · ').slice(1).join(' · ')); }
        else p.textContent = cap.text;
        if (cap.licenceUrl) { p.append(' '); const a = el('a', null, lang === 'th' ? 'สัญญาอนุญาต' : 'licence'); a.href = cap.licenceUrl; a.target = '_blank'; a.rel = 'noopener noreferrer'; p.appendChild(a); }
        body.appendChild(p);
      }
      if (it.img.byStudio) body.appendChild(el('p', 'cap', (lang === 'th' ? it.img.idTh : it.img.idEn) || t().byStudio));
    }

    for (const n of it.notes || []) body.appendChild(el('p', 'cap', lang === 'th' ? n.th : n.en));

    const priceBlock = el('div', 'block');
    priceBlock.appendChild(el('h3', null, lang === 'th' ? 'ราคา' : 'Price'));
    priceBlock.appendChild(el('p', null, (it.p == null ? '—' : baht(it.p)) + ' · ' + priceLine(it)));
    body.appendChild(priceBlock);

    if (it.v && it.v.length) {
      const b = el('div', 'block');
      b.appendChild(el('h3', null, lang === 'th' ? 'ตัวเลือก' : 'Options'));
      const opts = el('div', 'opts');
      it.v.forEach((v, i) => {
        const label = el('label');
        const radio = el('input');
        radio.type = 'radio'; radio.name = 'variant'; radio.checked = i === 0;
        radio.addEventListener('change', () => { variant = i; });
        label.append(radio, el('span', null, (lang === 'th' ? (v.th || v.en) : (v.en || v.th)) + (v.p != null ? ' · ' + baht(v.p) : '')));
        opts.appendChild(label);
      });
      b.appendChild(opts);
      body.appendChild(b);
    }

    const addBlock = el('div', 'block');
    const row = el('div', 'card__foot');
    const q = el('div', 'qty');
    const minus = el('button', null, '−'); minus.type = 'button'; minus.setAttribute('aria-label', lang === 'th' ? 'ลดจำนวน' : 'Fewer');
    const out = el('output', null, '1'); out.setAttribute('aria-live', 'polite');
    const plus = el('button', null, '+'); plus.type = 'button'; plus.setAttribute('aria-label', lang === 'th' ? 'เพิ่มจำนวน' : 'More');
    minus.addEventListener('click', () => { qty = Math.max(1, qty - 1); out.textContent = String(qty); });
    plus.addEventListener('click', () => { qty = Math.min(20, qty + 1); out.textContent = String(qty); });
    q.append(minus, out, plus);
    const addBtn = el('button', 'btn', t().add);
    addBtn.type = 'button';
    addBtn.addEventListener('click', () => { addToCart(it, qty, variant); dlg.close(); });
    row.append(q, addBtn);
    addBlock.appendChild(row);
    body.appendChild(addBlock);

    dlg.append(head, body);
    dlg.showModal();
  }

  /* ── the cart ────────────────────────────────────────────────────────── */
  function addToCart(it, qty, variantIndex) {
    const v = variantIndex != null && it.v && it.v[variantIndex] ? it.v[variantIndex] : null;
    const unit = v && v.p != null ? v.p : it.p;
    const key = it.id + '::' + (v ? (v.en || v.th) : '');
    const found = cart.find((l) => l.key === key);
    if (found) found.qty += qty;
    else cart.push({ key, itemId: it.id, nameTh: it.th || it.en, nameEn: it.en || it.th, qty, unitTHB: unit, variant: v ? (v.en || v.th) : null });
    render();
  }
  const cartTotal = () => cart.reduce((s, l) => s + (l.unitTHB || 0) * l.qty, 0);

  async function sendOrder(button) {
    if (!cart.length || !Me.table) return;
    button.disabled = true;
    button.textContent = t().sending;
    const now = new Date();
    const order = {
      id: 'o' + now.getTime().toString(36) + Math.random().toString(36).slice(2, 7),
      tableId: Me.table,
      tableName: 'Table ' + Me.table,
      placedAt: now.toISOString(),
      status: 'submitted',
      lines: cart.map((l) => ({ itemId: l.itemId, nameTh: l.nameTh, nameEn: l.nameEn, qty: l.qty, unitTHB: l.unitTHB, variant: l.variant })),
      totalTHB: cartTotal(),
      note: cartNote || '',
      history: [{ status: 'submitted', at: now.toISOString() }],
    };
    await Store.add(order);
    cart = []; cartNote = '';
    screen = 'orders';
    render();
  }

  /* ── screens ─────────────────────────────────────────────────────────── */
  function renderIndex(main) {
    const p = el('section', 'panel');
    p.appendChild(el('h2', null, t().indexTitle));
    p.appendChild(el('p', 'sub', t().indexSub));

    const notice = el('div', 'notice');
    notice.appendChild(el('p', null, t().demoBanner));
    p.appendChild(notice);

    const ul = el('ul', 'index-list');
    for (const key of ['menu', 'orders', 'kitchen', 'stats']) {
      const li = el('li');
      const b = el('button');
      b.type = 'button';
      b.append(el('strong', null, t().indexItems[key][0]), el('span', 'muted', t().indexItems[key][1]));
      b.addEventListener('click', () => { screen = key; render(); });
      li.appendChild(b);
      ul.appendChild(li);
    }
    p.appendChild(ul);
    main.appendChild(p);
  }

  function renderTablePicker(main) {
    const p = el('section', 'panel');
    p.appendChild(el('h2', null, t().pickTable));
    p.appendChild(el('p', 'sub', lang === 'th' ? 'ในร้านจริง ลูกค้าสแกน QR ที่โต๊ะ' : 'In the real thing a guest scans the QR card on the table.'));
    const row = el('div', 'tabs');

      row.appendChild(b);
    }
    p.appendChild(row);
    main.appendChild(p);
  }

  function renderMenu(main) {
    if (!Me.table) return renderTablePicker(main);

    const p = el('section', 'panel');
    const head = el('div', 'card__foot');
    head.style.marginBottom = '10px';
    head.appendChild(el('strong', null, tableName(Me.table)));
    const change = el('button', 'btn btn--quiet btn--small', t().changeTable);
    change.type = 'button';
    change.addEventListener('click', () => { Me.table = ''; render(); });
    head.appendChild(change);
    p.appendChild(head);

    const tools = el('div', 'tools');
    const tabs = el('div', 'tabs');
    for (const g of MENU.groups) {
      const b = el('button', null, lang === 'th' ? g.nameTh : g.nameEn);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(g.id === group && !query));
      b.addEventListener('click', () => { group = g.id; category = null; query = ''; render(); });
      tabs.appendChild(b);

    const search = el('div', 'search');
    const input = el('input');
    input.type = 'search'; input.value = query; input.placeholder = t().search;
    input.setAttribute('aria-label', t().search);
    input.addEventListener('input', () => { query = input.value.trim().toLowerCase(); render({ keepFocus: 'search' }); });
    search.appendChild(input);
    tools.appendChild(search);
    p.appendChild(tools);

    const groupObj = MENU.groups.find((g) => g.id === group) || MENU.groups[0];
    let items = MENU.items;
    if (query) items = items.filter((i) => i.q.includes(query));
    else items = items.filter((i) => i.g === groupObj.id);

    if (!query) {
      const chips = el('div', 'chips');
      for (const cid of groupObj.categoryIds) {
        const c = MENU.categories.find((x) => x.id === cid);
        if (!c) continue;
        const b = el('button', null, lang === 'th' ? c.nameTh : c.nameEn);
        b.type = 'button';
        b.setAttribute('aria-pressed', String(category === cid));
        b.addEventListener('click', () => { category = category === cid ? null : cid; render(); });
        chips.appendChild(b);
      }
      p.appendChild(chips);
      if (category) items = items.filter((i) => i.c === category);
    }

    if (!items.length) {
      p.appendChild(el('p', 'empty', t().searchNone));
      main.appendChild(p);
      return;
    }

    const byCat = new Map();
    for (const it of items) { if (!byCat.has(it.c)) byCat.set(it.c, []); byCat.get(it.c).push(it); }
    for (const [cid, list] of byCat) {
      const c = MENU.categories.find((x) => x.id === cid);
      const h = el('h3', 'cat-head', c ? (lang === 'th' ? c.nameTh : c.nameEn) : cid);
      if (c) h.appendChild(el('span', null, lang === 'th' ? c.nameEn : c.nameTh));
      p.appendChild(h);
      const grid = el('div', 'cards');
      for (const it of list) grid.appendChild(cardNode(it));
      p.appendChild(grid);
    }
    main.appendChild(p);
  }

  function renderCartBar() {
    const old = $('[data-bar]');
    if (old) old.remove();
    if (!cart.length || screen !== 'menu') return;
    const bar = el('div', 'bar');
    bar.setAttribute('data-bar', '');
    const wrap = el('div', 'wrap');
    const sum = el('div');
    sum.append(el('strong', null, baht(cartTotal())), el('div', 'muted', cart.reduce((s, l) => s + l.qty, 0) + (lang === 'th' ? ' รายการ' : ' items')));
    const go = el('button', 'btn', t().cart);
    go.type = 'button';
    go.addEventListener('click', () => { screen = 'cart'; render(); });
    wrap.append(sum, go);
    bar.appendChild(wrap);
    document.body.appendChild(bar);
  }

  function renderCart(main) {
    const p = el('section', 'panel');
    p.appendChild(el('h2', null, t().cart));
    p.appendChild(el('p', 'sub', tableName(Me.table || '—')));
    if (!cart.length) {
      p.appendChild(el('p', 'empty', t().cartEmpty));
      main.appendChild(p);
      return;
    }
    const ul = el('ul', 'list');
    for (const line of cart) {
      const li = el('li', 'row');
      const top = el('div', 'row__top');
      top.append(el('strong', null, lang === 'th' ? line.nameTh : line.nameEn), el('span', 'muted', line.variant || ''));
      li.appendChild(top);
      const foot = el('div', 'card__foot');
      const q = el('div', 'qty');
      const minus = el('button', null, '−'); minus.type = 'button'; minus.setAttribute('aria-label', t().remove);
      const out = el('output', null, String(line.qty));
      const plus = el('button', null, '+'); plus.type = 'button'; plus.setAttribute('aria-label', t().qty);
      minus.addEventListener('click', () => { line.qty -= 1; if (line.qty <= 0) cart = cart.filter((l) => l !== line); render(); });
      plus.addEventListener('click', () => { line.qty += 1; render(); });
      q.append(minus, out, plus);
      foot.append(q, el('div', 'price', baht((line.unitTHB || 0) * line.qty)));
      li.appendChild(foot);
      ul.appendChild(li);
    }
    p.appendChild(ul);

    const noteBlock = el('div', 'block');
    const lbl = el('label');
    lbl.appendChild(el('h3', null, t().note));
    const ta = el('input');
    ta.type = 'text'; ta.value = cartNote; ta.placeholder = t().notePlaceholder;
    ta.style.cssText = 'width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-m);background:var(--surface);font:inherit';
    ta.addEventListener('input', () => { cartNote = ta.value; });
    lbl.appendChild(ta);
    noteBlock.appendChild(lbl);
    p.appendChild(noteBlock);

    const totalRow = el('div', 'total');
    totalRow.append(el('span', null, t().total), el('span', null, baht(cartTotal())));
    p.appendChild(totalRow);

    const send = el('button', 'btn btn--wide', t().send);
    send.type = 'button';
    send.style.marginTop = '14px';
    send.addEventListener('click', () => sendOrder(send));
    p.appendChild(send);
    main.appendChild(p);
  }

  function orderRow(o, withMoves) {
    const li = el('li', 'row');
    const top = el('div', 'row__top');
    top.append(
      el('strong', null, tableName(o.tableId)),
      el('span', 'status status--' + o.status, t().status[o.status] || o.status),
      el('span', 'muted', new Date(o.placedAt).toLocaleTimeString(lang === 'th' ? 'th-TH' : 'en-GB', { hour: '2-digit', minute: '2-digit' })),
    );
    li.appendChild(top);
    const lines = el('ul', 'lines');
    for (const l of o.lines || []) {
      const row = el('li');
      row.append(el('span', null, l.qty + '× ' + (lang === 'th' ? l.nameTh : l.nameEn) + (l.variant ? ' · ' + l.variant : '')), el('span', null, baht((l.unitTHB || 0) * l.qty)));
      lines.appendChild(row);
    }
    li.appendChild(lines);
    if (o.note) li.appendChild(el('p', 'muted', t().note + ': ' + o.note));
    const total = el('div', 'total');
    total.append(el('span', null, t().total), el('span', null, baht(o.totalTHB || 0)));
    li.appendChild(total);

    if (withMoves) {
      const next = { submitted: ['accepted', 'rejected'], accepted: ['preparing'], preparing: ['ready'], ready: ['served'] }[o.status] || [];
      if (next.length) {
        const acts = el('div', 'actions');
        for (const s of next) {
          const b = el('button', 'btn btn--small' + (s === 'rejected' ? ' btn--quiet' : ''), t().move[s]);
          b.type = 'button';
          b.addEventListener('click', () => Store.setStatus(o.id, s));
          acts.appendChild(b);
        }
        li.appendChild(acts);
      }
    }
    return li;
  }

  function renderMyOrders(main) {
    const p = el('section', 'panel');
    p.appendChild(el('h2', null, t().myOrders));
    p.appendChild(el('p', 'sub', Me.table ? tableName(Me.table) : t().pickTable));
    const mine = Me.table ? Store.forTable(Me.table) : [];
    if (!mine.length) { p.appendChild(el('p', 'empty', t().noOrders)); main.appendChild(p); return; }
    const ul = el('ul', 'list');
    for (const o of mine) ul.appendChild(orderRow(o, false));
    p.appendChild(ul);
    main.appendChild(p);
  }

  function renderKitchen(main) {
    const p = el('section', 'panel');
    p.appendChild(el('h2', null, t().kitchenTitle));
    p.appendChild(el('p', 'sub', t().kitchenSub));
    const all = Store.all();
    if (!all.length) { p.appendChild(el('p', 'empty', t().noKitchen)); main.appendChild(p); return; }
    const cols = el('div', 'cols');
    for (const s of ['submitted', 'accepted', 'preparing', 'ready', 'served']) {
      const list = all.filter((o) => o.status === s);
      const col = el('div', 'col');
      const h = el('h3');
      h.append(el('span', null, t().status[s]), el('span', 'muted', String(list.length)));
      col.appendChild(h);
      const ul = el('ul', 'list');
      for (const o of list) ul.appendChild(orderRow(o, true));
      if (!list.length) ul.appendChild(el('li', 'muted', '—'));
      col.appendChild(ul);
      cols.appendChild(col);
    }
    p.appendChild(cols);
    const done = all.filter((o) => o.status === 'rejected' || o.status === 'cancelled');
    if (done.length) {
      p.appendChild(el('h3', 'cat-head', t().status.rejected));
      const ul = el('ul', 'list');
      for (const o of done) ul.appendChild(orderRow(o, false));
      p.appendChild(ul);
    }
    main.appendChild(p);
  }

  function renderStats(main) {
    const p = el('section', 'panel');
    p.appendChild(el('h2', null, t().statsTitle));
    p.appendChild(el('p', 'sub', t().statsSub));
    const all = Store.all().filter((o) => o.status !== 'rejected' && o.status !== 'cancelled');
    if (!all.length) { p.appendChild(el('p', 'empty', t().noStats)); main.appendChild(p); return; }

    const today = new Date().toISOString().slice(0, 10);
    const items = all.reduce((s, o) => s + (o.lines || []).reduce((n, l) => n + l.qty, 0), 0);
    const revenue = all.reduce((s, o) => s + (o.totalTHB || 0), 0);
    const tiles = el('div', 'tiles');
    const tile = (n, label) => { const d = el('div', 'tile'); d.append(el('b', null, String(n)), el('span', null, label)); return d; };
    tiles.append(
      tile(all.filter((o) => String(o.placedAt).slice(0, 10) === today).length, t().ordersToday),
      tile(all.length, t().ordersAll),
      tile(items, t().itemsSold),
      tile(baht(Math.round(revenue / all.length)), t().avg),
    );
    p.appendChild(tiles);

    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
      days.push({ d, n: all.filter((o) => String(o.placedAt).slice(0, 10) === d).length });
    }
    const top = Math.max(1, ...days.map((x) => x.n));
    const chartWrap = el('div', 'chart-wrap');
    chartWrap.appendChild(el('h3', 'cat-head', t().last7));
    const chart = el('div', 'chart');
    for (const day of days) {
      const bar = el('div');
      bar.style.height = Math.round((day.n / top) * 100) + '%';
      bar.title = day.d + ' · ' + day.n;
      bar.appendChild(el('span', null, day.d.slice(5)));
      chart.appendChild(bar);
    }
    chartWrap.appendChild(chart);
    p.appendChild(chartWrap);

    const counts = new Map();
    for (const o of all) for (const l of o.lines || []) counts.set(l.itemId, (counts.get(l.itemId) || 0) + l.qty);
    const ranked = [...counts.entries()].sort((a, b) => b[1] - a[1]);
    const nameById = (id) => { const it = MENU.items.find((x) => x.id === id); return it ? nameOf(it) : id; };
    const listOf = (rows) => { const ul = el('ul', 'lines'); for (const [id, n] of rows) { const li = el('li'); li.append(el('span', null, nameById(id)), el('span', null, String(n))); ul.appendChild(li); } return ul; };
    const two = el('div', 'cols');
    const a = el('div', 'col'); a.appendChild(el('h3', null, t().most)); a.appendChild(listOf(ranked.slice(0, 5)));
    const b = el('div', 'col'); b.appendChild(el('h3', null, t().least)); b.appendChild(listOf(ranked.slice(-5).reverse()));
    two.append(a, b);
    p.appendChild(two);
    main.appendChild(p);
  }

  /* ── frame ───────────────────────────────────────────────────────────── */
  function renderScreens() {
    const nav = $('[data-screens]');
    nav.textContent = '';
    for (const key of ['index', 'menu', 'orders', 'kitchen', 'stats']) {
      const b = el('button', null, t().screens[key]);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(screen === key || (screen === 'cart' && key === 'menu')));
      b.addEventListener('click', () => { screen = key; render(); window.scrollTo(0, 0); });
      nav.appendChild(b);
    }
  }

  function render(opts) {
    const main = $('#main');
    const focusWasSearch = opts && opts.keepFocus === 'search';
    const caret = focusWasSearch && $('.search input') ? $('.search input').selectionStart : null;
    main.textContent = '';
    renderScreens();
    for (const node of document.querySelectorAll('[data-t]')) {
      const key = node.getAttribute('data-t');
      if (key === 'storeNote') node.textContent = Store.shared ? t().sharedOn : t().sharedOff;
      else node.textContent = t()[key] || '';
    }
    document.documentElement.lang = lang;
    if (screen === 'index') renderIndex(main);
    else if (screen === 'menu') renderMenu(main);
    else if (screen === 'cart') renderCart(main);
    else if (screen === 'orders') renderMyOrders(main);
    else if (screen === 'kitchen') renderKitchen(main);
    else if (screen === 'stats') renderStats(main);
    renderCartBar();
    if (focusWasSearch) {
      const input = $('.search input');
      if (input) { input.focus(); if (caret != null) input.setSelectionRange(caret, caret); }
    }
  }

  for (const b of document.querySelectorAll('[data-lang]')) {
    b.addEventListener('click', () => {
      lang = b.getAttribute('data-lang');
      for (const other of document.querySelectorAll('[data-lang]')) other.setAttribute('aria-pressed', String(other === b));
      render();
    });
  }

  render();
  Store.onChange(() => render());
  Store.init().then(() => render());
})();
</script>
